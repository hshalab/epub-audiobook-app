{% extends "base.html" %}
{% block title %}Flow · EPUB Audiobook{% endblock %}
{% block content %}
<h1>Flow xử lý patch</h1>
<p class="text-muted">Mỗi node của mỗi patch là một job độc lập. Job sau chỉ chạy khi job trước hoàn tất.</p>
<section class="card" style="padding:var(--space-lg);margin-bottom:var(--space-lg)">
  <h2>Tạo flow</h2>
  <form id="create-flow" style="display:flex;gap:1rem;flex-wrap:wrap;align-items:end">
    <label>Tên <input name="name" required placeholder="Audio → Video → YouTube"></label>
    <label><input type="checkbox" name="node" value="audio" checked> Tạo âm thanh</label>
    <label><input type="checkbox" name="node" value="video" checked> Tạo video</label>
    <label><input type="checkbox" name="node" value="youtube"> Upload YouTube</label>
    <button type="submit">Lưu flow</button>
  </form>
</section>
<section class="card" style="padding:var(--space-lg)">
  <h2>Tạo hàng loạt job</h2>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem">
    <label>Flow<select id="flow">{% for f in flows %}<option value="{{ f.id }}">{{ f.name }} · {{ f.nodes|join(' → ') }}</option>{% endfor %}</select></label>
    <label>Sách<select id="book"><option value="">Chọn sách</option>{% for b in books %}<option value="{{ b.id }}">{{ b.title }}</option>{% endfor %}</select></label>
    <label>Quyền riêng tư<select id="privacy"><option>private</option><option>unlisted</option><option>public</option></select></label>
  </div>
  <div id="patches" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.5rem;margin:1rem 0"></div>
  <button id="run" type="button" disabled>Tạo job cho patch đã chọn</button>
  <span id="message"></span>
</section>
{% endblock %}
{% block scripts %}<script>
const flow = document.getElementById('flow'), book = document.getElementById('book');
document.getElementById('create-flow').addEventListener('submit', async e => { e.preventDefault(); const fd=new FormData(e.target); const nodes=fd.getAll('node'); if(!nodes.length)return alert('Chọn ít nhất một node'); const r=await fetch('/flows/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:fd.get('name'),nodes})}); if(r.ok)location.reload(); else alert((await r.json()).detail); });
book.addEventListener('change', async () => { const box=document.getElementById('patches'); box.replaceChildren(); document.getElementById('run').disabled=true; if(!book.value||!flow.value)return; const data=await (await fetch(`/flows/${flow.value}/patches?book_id=${book.value}`)).json(); for(const p of data.patches){const label=document.createElement('label'); label.innerHTML=`<input type="checkbox" value="${p.id}" checked> Patch ${p.index+1}: ${p.name||p.status}`; box.append(label)} document.getElementById('run').disabled=!data.patches.length; });
document.getElementById('run').addEventListener('click', async () => { const ids=[...document.querySelectorAll('#patches input:checked')].map(x=>+x.value); if(!ids.length)return; const r=await fetch(`/flows/${flow.value}/runs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({book_id:+book.value,patch_ids:ids,privacy:document.getElementById('privacy').value})}); const data=await r.json(); document.getElementById('message').innerHTML=r.ok?`Đã tạo ${data.job_count} job. <a href="/queue">Xem hàng đợi</a>`:(data.detail||'Có lỗi'); });
</script>{% endblock %}
