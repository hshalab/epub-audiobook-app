{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div style="text-align:center;padding:var(--space-4xl) var(--space-xl);max-width:480px;margin:0 auto">
    <h1 style="font-size:var(--font-size-4xl);color:var(--text-muted);margin-bottom:var(--space-lg)">404</h1>
    <h2 style="font-size:var(--font-size-xl);margin-bottom:var(--space-md)">Page not found</h2>
    <p style="color:var(--text-secondary);margin-bottom:var(--space-2xl)">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/books" class="btn-primary">Back to books</a>
</div>
{% endblock %}
